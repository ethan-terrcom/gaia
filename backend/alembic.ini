# Alembic configuration (doc 03 task 8). Run it from backend/: `make migrate`.
#
# There is deliberately no `sqlalchemy.url` here. alembic/env.py reads the URL
# from gaia.config.settings, so the database location has one source of truth
# (GAIA_DB_URL, or GAIA_DATA_DIR + /gaia.sqlite) and can never drift from the
# one the app uses.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# SQLite cannot ALTER most things, so render migrations as table copies. This is
# also what makes the same migration run on SQLite and PostgreSQL (ARCH section 7).
render_as_batch = true
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
