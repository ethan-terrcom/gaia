# LLM prices, USD per 1M tokens.
#
# Every value is loaded by gaia.services.costs.load_price_table and can be
# edited without a code change. Tests do not use this file; they build their
# own PriceTable so a placeholder here can never make a test pass or fail.

[models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0

# DeepSeek: read 2026-11-14 from https://api-docs.deepseek.com/quick_start/pricing
# (lead review 07b). Peak is 01:00-04:00 and 06:00-10:00 UTC, Monday to Friday;
# every other hour is off-peak at half price. DeepSeek also treats Chinese
# public holidays as off-peak; Gaia prices them at peak (it over-counts slightly,
# which is the safe direction for a budget). DeepSeek has no cache-write charge.
# `input` is the cache-miss rate and `cache_read` the cache-hit rate.

[models.deepseek-v4-pro]
input = 1.32
output = 3.96
cache_read = 0.044
cache_write = 0.0
peak_windows_utc = [[1, 4], [6, 10]]
peak_weekdays_only = true

[models.deepseek-v4-pro.off_peak]
input = 0.66
output = 1.98
cache_read = 0.022
cache_write = 0.0

[models.deepseek-flash]
input = 0.30
output = 1.20
cache_read = 0.006
cache_write = 0.0
peak_windows_utc = [[1, 4], [6, 10]]
peak_weekdays_only = true

[models.deepseek-flash.off_peak]
input = 0.15
output = 0.60
cache_read = 0.003
cache_write = 0.0
