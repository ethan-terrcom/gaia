# LLM prices, USD per 1M tokens.
#
# Every value is loaded by gaia.services.costs.load_price_table and can be
# edited without a code change. Tests do not use this file; they build their
# own PriceTable so a placeholder here can never make a test pass or fail.

[models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0

[models.deepseek-v4-pro]
# VERIFY: https://api-docs.deepseek.com/quick_start/pricing
input = 0.50
output = 1.50
cache_read = 0.05
cache_write = 0.0
# VERIFY: the real peak/off-peak window before enabling off-peak pricing.
# start == end deliberately disables off-peak selection in PriceTable.
off_peak_start_utc = 0
off_peak_end_utc = 0

[models.deepseek-v4-pro.off_peak]
# VERIFY: https://api-docs.deepseek.com/quick_start/pricing (off-peak is half
# of the peak rate in the lead's notes; confirm current numbers).
input = 0.25
output = 0.75
cache_read = 0.025
cache_write = 0.0

[models.deepseek-flash]
# VERIFY: https://api-docs.deepseek.com/quick_start/pricing
input = 0.10
output = 0.40
cache_read = 0.01
cache_write = 0.0
# VERIFY: the real peak/off-peak window before enabling off-peak pricing.
# start == end deliberately disables off-peak selection in PriceTable.
off_peak_start_utc = 0
off_peak_end_utc = 0

[models.deepseek-flash.off_peak]
# VERIFY: https://api-docs.deepseek.com/quick_start/pricing
input = 0.05
output = 0.20
cache_read = 0.005
cache_write = 0.0
